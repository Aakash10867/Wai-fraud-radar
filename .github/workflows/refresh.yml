name: refresh-data

on:
  schedule:
    - cron: "30 2 * * 1"   # every Monday, 08:00 IST
  workflow_dispatch:        # also runnable from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests gate the run
        run: python -m pytest -q
      - name: Collect financial statements
        run: python -m src.collect
      - name: Score companies
        run: python -m src.run
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh data and scores"
            git push
          fi
